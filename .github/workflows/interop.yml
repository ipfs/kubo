# Interoperability Tests
#
# This workflow ensures Kubo remains compatible with the broader IPFS ecosystem.
# It builds Kubo from source, then runs:
#
# 1. helia-interop: Tests compatibility with Helia (JavaScript IPFS implementation)
#    using Playwright-based tests from @helia/interop package.
#
# 2. ipfs-webui: Runs E2E tests from ipfs/ipfs-webui repository to verify
#    the web interface works correctly with the locally built Kubo binary.
#
# Both jobs use caching to speed up repeated runs (npm dependencies, Playwright
# browsers, and webui build artifacts).

name: Interop

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches:
      - 'master'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  interop-prep:
    if: github.repository == 'ipfs/kubo' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEST_DOCKER: 0
      TEST_FUSE: 0
      TEST_VERBOSE: 1
      GIT_PAGER: cat
      IPFS_CHECK_RCMGR_DEFAULTS: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: kubo
          path: cmd/ipfs/ipfs
  helia-interop:
    needs: [interop-prep]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      # Pin a concrete major instead of an lts/ alias. setup-node resolves an
      # alias by fetching the actions/node-versions manifest from GitHub with no
      # retry and no fallback, so a GitHub blip fails the job outright. A
      # concrete version falls back to downloading from nodejs.org.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: kubo
          path: cmd/ipfs
      - run: chmod +x cmd/ipfs/ipfs
      # Cache node_modules based on latest @helia/interop version from npm registry.
      # This ensures we always test against the latest release while still benefiting
      # from caching when the version hasn't changed.
      - name: Get latest @helia/interop version
        id: helia-version
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if version=$(npm view @helia/interop version); then break; fi
            echo "npm view failed (attempt $attempt of 3), retrying" >&2
            sleep $((attempt * 5))
          done
          if [ -z "${version:-}" ]; then
            echo "could not resolve the latest @helia/interop version from the npm registry" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Restore and save are separate so a failed install cannot be cached under
      # a version key and then reused by every later run on that version.
      - name: Restore helia-interop node_modules
        uses: actions/cache/restore@v6
        id: helia-cache
        with:
          path: node_modules
          key: ${{ runner.os }}-helia-interop-${{ steps.helia-version.outputs.version }}
      # Install the exact version the cache key names. Plain `npm install
      # @helia/interop` is a second `latest` lookup, and helia has published
      # several interop versions within an hour, so the key could name a version
      # that is not the one on disk.
      - name: Install @helia/interop@${{ steps.helia-version.outputs.version }}
        if: steps.helia-cache.outputs.cache-hit != 'true'
        run: npm install --fetch-retries=5 --fetch-retry-maxtimeout=120000 "@helia/interop@${{ steps.helia-version.outputs.version }}"
      # Search for the compiled specs rather than hardcoding where they live.
      # Upstream has already moved this stuff around more than once, and every
      # time it did, this job failed with mocha's unhelpful "no test files
      # found". Searching survives a move; if the specs stop being called
      # *.spec.js the job still fails, but it says so in one line.
      - name: Find the compiled interop specs
        working-directory: node_modules/@helia/interop
        run: |
          set -euo pipefail
          find . -name '*.spec.js' -not -path './node_modules/*' | sort > "$RUNNER_TEMP/helia-specs.txt"
          count=$(wc -l < "$RUNNER_TEMP/helia-specs.txt")
          echo "@helia/interop@${{ steps.helia-version.outputs.version }} ships $count compiled spec files:"
          cat "$RUNNER_TEMP/helia-specs.txt"
          if [ "$count" -eq 0 ]; then
            echo "found no compiled *.spec.js in the published package, so its layout changed" >&2
            exit 1
          fi
      - name: Save helia-interop node_modules
        if: steps.helia-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-helia-interop-${{ steps.helia-version.outputs.version }}
      # We run aegir directly (instead of the helia-interop binary) because the
      # bin spawns a bare `aegir test` with no way to pass the flags below.
      #
      # --files: pass the specs we found above rather than trusting the .aegir.js
      # that @helia/interop publishes, which is written for running inside the
      # helia monorepo and has broken this job twice. It globs the TypeScript
      # sources (./src/*.spec.ts), which node refuses to type-strip under
      # node_modules (ERR_UNSUPPORTED_NODE_MODULES_TYPE_STRIPPING, no tsconfig is
      # shipped), and versions 11.0.0-11.0.2 shipped no config at all
      # (ipfs/helia#1049), leaving aegir with nothing to discover.
      #
      # --exit: the node interop specs spawn kubo daemons (via ipfsd-ctl +
      # KUBO_BINARY) whose libp2p/RPC handles keep Node's event loop alive after
      # the run, so mocha prints its summary and then hangs until the job timeout.
      # Force exit once the run completes.
      - name: Run helia-interop tests
        run: |
          set -euo pipefail
          mapfile -t specs < "$RUNNER_TEMP/helia-specs.txt"
          npx aegir test -t node --bail --files "${specs[@]}" -- --exit
        env:
          KUBO_BINARY: ${{ github.workspace }}/cmd/ipfs/ipfs
        working-directory: node_modules/@helia/interop
  ipfs-webui:
    needs: [interop-prep]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NO_SANDBOX: true
      LIBP2P_TCP_REUSEPORT: false
      LIBP2P_ALLOW_WEAK_RSA_KEYS: 1
      E2E_IPFSD_TYPE: go
      GIT_PAGER: cat
      IPFS_CHECK_RCMGR_DEFAULTS: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kubo
          path: cmd/ipfs
      - run: chmod +x cmd/ipfs/ipfs
      - uses: actions/checkout@v7
        with:
          repository: ipfs/ipfs-webui
          path: ipfs-webui
      - uses: actions/setup-node@v7
        with:
          node-version-file: 'ipfs-webui/.tool-versions'
      - id: webui-ref
        run: echo "ref=$(git rev-parse --short HEAD)" | tee -a $GITHUB_OUTPUT
        working-directory: ipfs-webui
      - id: webui-state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ENDPOINT: repos/ipfs/ipfs-webui/commits/${{ steps.webui-ref.outputs.ref }}/status
          SELECTOR: .state
          KEY: state
        run: gh api "$ENDPOINT" --jq "$SELECTOR" | xargs -I{} echo "$KEY={}" | tee -a $GITHUB_OUTPUT
      # Cache node_modules based on package-lock.json
      - name: Cache node_modules
        uses: actions/cache@v6
        id: node-modules-cache
        with:
          path: ipfs-webui/node_modules
          key: ${{ runner.os }}-webui-node-modules-${{ hashFiles('ipfs-webui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-webui-node-modules-
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --progress=false
        working-directory: ipfs-webui
      # Cache Playwright browsers
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('ipfs-webui/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      # Only chromium is needed: ipfs-webui's playwright config declares no
      # projects, so Playwright runs its default browser. Installing OS
      # dependencies for all three pulls in the ffmpeg stack that firefox and
      # webkit need, which has taken longer than this job's whole budget when
      # the Ubuntu mirror is slow.
      # On cache miss: download the browser and install OS dependencies
      - name: Install Playwright with dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        timeout-minutes: 8
        working-directory: ipfs-webui
      # On cache hit: top up OS dependencies, best effort. The runner image
      # already ships what headless chromium needs, so this is belt and
      # braces. It runs apt-get update first, which has taken over four
      # minutes at 39 kB/s when the Ubuntu mirror is slow, so cap it and carry
      # on. A library that really is missing shows up when the browser fails
      # to launch, which names the problem far better than a stalled install.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        timeout-minutes: 4
        continue-on-error: true
        working-directory: ipfs-webui
      # Cache test build output
      - name: Cache test build
        uses: actions/cache@v6
        id: test-build-cache
        with:
          path: ipfs-webui/build
          key: ${{ runner.os }}-webui-build-${{ hashFiles('ipfs-webui/package-lock.json', 'ipfs-webui/src/**', 'ipfs-webui/public/**') }}
          restore-keys: |
            ${{ runner.os }}-webui-build-
      - name: Build ipfs-webui@${{ steps.webui-ref.outputs.ref }} (state=${{ steps.webui-state.outputs.state }})
        if: steps.test-build-cache.outputs.cache-hit != 'true'
        run: npm run test:build
        working-directory: ipfs-webui
      - name: Test ipfs-webui@${{ steps.webui-ref.outputs.ref }} (state=${{ steps.webui-state.outputs.state }}) E2E against the locally built Kubo binary
        run: npm run test:e2e
        env:
          IPFS_GO_EXEC: ${{ github.workspace }}/cmd/ipfs/ipfs
        working-directory: ipfs-webui
      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: webui-test-results
          path: ipfs-webui/test-results/
          retention-days: 7
